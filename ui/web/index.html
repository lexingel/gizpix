<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="gizpix-token" content="{{TOKEN}}">
<title>Gizpix</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Jobs">
    <div class="brand">Gizpix</div>
    <ul id="jobs"></ul>
    <p class="rail-foot" id="railFoot"></p>
  </nav>
  <main id="main" tabindex="-1">
    <header class="top">
      <div>
        <h1 id="title"></h1>
        <p class="intro" id="intro"></p>
      </div>
      <ol class="flow" id="flow" aria-label="Steps"></ol>
    </header>
    <div id="view"></div>
    <p class="keys" id="keys"></p>
  </main>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script src="/static/strings.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
